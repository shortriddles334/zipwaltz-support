<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Join my Zipwaltz Rescue">
  <meta property="og:description" content="Two pilots, one stranded beacon. Open this invite on your iPhone to fly together.">
  <title>Join my Zipwaltz Rescue</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    [hidden] { display: none !important; }
    main.container { max-width: 36rem; }
    .brand { color: #8be6dc; }
    .button-link { font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { border: 1px solid #8be6dc; border-radius: 10px; background: transparent; color: #8be6dc; padding: 11px 16px; margin: 5px 0 15px; font: inherit; cursor: pointer; }
    .actions { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
    button:focus-visible { outline: 3px solid #ffc765; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="container">
    <p class="brand">Zipwaltz</p>
    <h1>Join a Rescue</h1>
    <p id="instructions" class="lead">Open the invite your host shared to join their flight.</p>
    <div class="actions" id="actions" hidden>
      <a class="button-link" id="open">Open in Zipwaltz</a>
      <button class="secondary" id="copy" type="button">Copy invite link</button>
    </div>
    <p id="help" class="muted" hidden>Use the Rescue build from TestFlight on your iPhone. If your chat app keeps you here, open this page in Safari or paste the invite link into Rescue.</p>
    <p id="status" role="status"></p>
    <noscript>Open the Rescue build and paste this page’s full address into the invite field.</noscript>
  </main>
  <script>
    'use strict';
    const byId = (name) => document.getElementById(name);
    function showRoom() {
      const room = location.hash.slice(1);
      const valid = room.length >= 20 && room.length <= 256 && !/[^A-Za-z0-9:_-]/.test(room);
      byId('instructions').textContent = valid
        ? 'Your partner is hosting. Open the game and tap Join Rescue.'
        : 'This invite is missing its room. Ask your host to share a fresh link.';
      byId('actions').hidden = !valid;
      byId('help').hidden = !valid;
      byId('status').textContent = '';
      if (valid) byId('open').href = 'skythread://rescue/join?id=' + encodeURIComponent(room);
      else byId('open').removeAttribute('href');
    }
    byId('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        byId('status').textContent = 'Invite link copied.';
      } catch {
        byId('status').textContent = 'Use your browser’s Share menu to copy this link.';
      }
    });
    window.addEventListener('hashchange', showRoom);
    showRoom();
  </script>
</body>
</html>
